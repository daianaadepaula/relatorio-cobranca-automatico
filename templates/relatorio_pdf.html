<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4 portrait;
            margin: 1.5cm;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #2d3748;
            margin: 0;
            padding: 0;
        }
        
        /* Cabeçalho Corporativo */
        .header {
            border-bottom: 3px solid #4c51bf;
            padding-bottom: 8px;
            margin-bottom: 18px;
        }
        h1 {
            color: #1a202c;
            font-size: 18pt;
            margin: 0 0 4px 0;
            font-weight: bold;
        }
        .sub {
            color: #718096;
            font-size: 9pt;
        }

        /* Container de KPIs em Tabela para compatibilidade */
        .kpi-table {
            width: 100%;
            margin-bottom: 20px;
        }
        .kpi-card {
            background-color: #f7fafc;
            border: 1px solid #dfe6e9;
            border-left: 4px solid #4c51bf;
            padding: 10px;
            text-align: center;
        }
        .kpi-card-sucesso {
            border-left: 4px solid #38a169;
        }
        .kpi-card-falha {
            border-left: 4px solid #e53e3e;
        }
        .kpi-title {
            font-size: 8pt;
            color: #718096;
            margin-bottom: 4px;
        }
        .kpi-value {
            font-size: 14pt;
            font-weight: bold;
            color: #1a202c;
        }

        /* Tabela Principal com Larguras Definidas em % */
        .data-table {
            width: 100%;
            margin-top: 10px;
        }
        .data-table th {
            background-color: #4c51bf;
            color: #ffffff;
            text-align: left;
            padding: 8px;
            font-size: 9pt;
            font-weight: bold;
        }
        .data-table td {
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 8.5pt;
            color: #2d3748;
        }

        /* Estilo do Status */
        .status-sucesso {
            color: #2f855a;
            font-weight: bold;
        }
        .status-erro {
            color: #c53030;
            font-weight: bold;
        }

        /* Linha zebra em registros pares */
        .row-even {
            background-color: #f7fafc;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <div class="header">
        <h1>Relatório Executivo de Disparos — RPA</h1>
        <div class="sub">Execução realizada em: <strong>{data_execucao}</strong></div>
    </div>

    <!-- Cards de Métricas (KPIs) -->
    <table class="kpi-table">
        <tr>
            <td width="32%">
                <div class="kpi-card">
                    <div class="kpi-title">TOTAL PROCESSADO</div>
                    <div class="kpi-value">{total_processados}</div>
                </div>
            </td>
            <td width="2%"></td>
            <td width="32%">
                <div class="kpi-card kpi-card-sucesso">
                    <div class="kpi-title">ENVIADOS COM SUCESSO</div>
                    <div class="kpi-value" style="color: #2f855a;">{total_sucesso}</div>
                </div>
            </td>
            <td width="2%"></td>
            <td width="32%">
                <div class="kpi-card kpi-card-falha">
                    <div class="kpi-title">FALHAS DE ENVIO</div>
                    <div class="kpi-value" style="color: #c53030;">{total_falhas}</div>
                </div>
            </td>
        </tr>
    </table>

    <!-- Tabela de Detalhamento com Larguras Fixas (%) -->
    <table class="data-table">
        <thead>
            <tr>
                <th width="15%">Horário</th>
                <th width="25%">Cliente</th>
                <th width="32%">E-mail</th>
                <th width="15%">Valor</th>
                <th width="13%">Status</th>
            </tr>
        </thead>
        <tbody>
            {linhas_tabela}
        </tbody>
    </table>

</body>
</html>
